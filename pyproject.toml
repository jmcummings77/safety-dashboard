[project]
name = "safety-dashboard"
version = "0.1.0"
description = "Dashboard of publicly filed safety records for theme park rides, bridges and other public equipment."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pdfplumber>=0.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3.5"]

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/build.py"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["raw", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # the source PDFs use curly quotes; matching them is intentional

[tool.ruff.lint.isort]
known-first-party = ["sources"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # fixture text is copied verbatim from the source PDF
